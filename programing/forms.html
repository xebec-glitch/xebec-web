<!DOCTYPE html>
<html>
<head>
    <title>Forms</title>
    <link rel="stylesheet" href="C:\Users\5340\Desktop\front end learning\css\style2.css">
</head>
<body>
    <main class="contact">
        <h1>welcome to xebec</h1>
        <form>
            <div class="form-group">
                <label for="fname">First Name:</label>
                <input type="text" id="fname" name="first_name" required>
            </div>

            <div class="form-group">
                <label for="lname">Last Name:</label>
                <input type="text" id="lname" name="last_name" required>
            </div>

            <div class="form-group span-all">
                <label for="Email">Email Address:</label>
                <input type="Email" id="Email" name="Email" required>
            </div>

            <fieldset class="span-all">
                <legend>Query Type:</legend>
                
                <div class="form-group">
                    <label for="general">General Inquiry</label>
                    <input type="radio" id="general" name="query_type" value="General Inquiry" required>
                </div>

                <div class="form-group">
                    <label for="support">Support Request</label>
                    <input type="radio" id="support" name="query_type" value="Support Request" required>
                </div>
            </fieldset>        

            <div class="form-group span-all">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" required></textarea>
            </div>

            <div class="form-group span-all">
                <label for="consent">I consent to being contacted by the team</label>
                <input type="checkbox" id="consent" name="consent" required>
            </div>

            <button class="span-all">Submit</button>
        </form>



    </main>

</body>
</html>
